spring:
  application:
    name: aemet
  datasource:
    url: jdbc:h2:mem:aemet;DB_CLOSE_DELAY=-1
  jpa:
    open-in-view: false
aemet:
  api-key: ${AEMET_API_KEY:}
  base-url: ${AEMET_BASE_URL:https://opendata.aemet.es/opendata}
  timeout: ${AEMET_TIMEOUT:5s}

forecast:
  cache-ttl: ${FORECAST_CACHE_TTL:4h}
  fallback-cache-ttl: ${FORECAST_FALLBACK_CACHE_TTL:24h}
  fallback-cache-size: ${FORECAST_FALLBACK_CACHE_SIZE:10000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
